error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;
    access_log /dev/stdout;

    server {
        # Port 8080 configuré sur Railway
        listen 8080;
        
        # Racine unique : Tout ce qui est dans public/ finit dans dist/ après npm run build
        root /app/dist;
        index index.html index.php;

        # Fichiers statiques et SPA Vue.js
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Assets Vite (Cache long terme recommandé)
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # Traitement des fichiers PHP
        location ~ \.php$ {
            # On s'assure que le fichier existe bien dans /app/dist
            try_files $uri =404;
            
            # Connexion au socket PHP-FPM (127.0.0.1:9000)
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            
            # SCRIPT_FILENAME pointe maintenant vers /app/dist/tonfichier.php
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Sécurité : Bloquer l'accès aux fichiers sensibles
        location ~ /\.(git|env|htaccess) {
            deny all;
        }
    }
}