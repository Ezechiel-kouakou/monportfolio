name: Build and deploy PHP app to Azure Web App

on:
  push:
    branches:
      - monportfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Build
        run: |
          npm install
          npm run build
          [ -f public/config.php ] && cp public/config.php dist/ || echo "config.php non trouvé dans public"
          [ -f public/traitement.php ] && cp public/traitement.php dist/ || echo "traitement.php non trouvé dans public"
          [ -f public/.htaccess ] && cp public/.htaccess dist/ || echo ".htaccess non trouvé dans public"
          [ -f config.php ] && cp config.php dist/ || echo "config.php non trouvé à la racine"
          [ -f traitement.php ] && cp traitement.php dist/ || echo "traitement.php non trouvé à la racine"
          [ -f .htaccess ] && cp .htaccess dist/ || echo ".htaccess non trouvé à la racine"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        with:
          app-name: "monportfolio"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
