name: Build and deploy PHP app to Azure Web App

on:
  push:
    branches:
      - monportfolio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Build
        run: |
          npm install
          npm run build
          # On copie tes fichiers PHP s'ils existent dans public/
          [ -f public/config.php ] && cp public/config.php dist/ || true
          [ -f public/traitement.php ] && cp public/traitement.php dist/ || true
          [ -f public/api_proxy.php ] && cp public/api_proxy.php dist/ || true

          [ -f config.php ] && cp config.php dist/ || true
          [ -f traitement.php ] && cp traitement.php dist/ || true
          [ -f api_proxy.php ] && cp api_proxy.php dist/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        with:
          app-name: "monportfolio"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
